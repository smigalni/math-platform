name: Build review PDFs

on:
  push:
    branches:
      - review/**
    paths:
      - "review/**/*.md"
      - ".github/workflows/build-review-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-european

      - name: Build PDFs from Markdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          while IFS= read -r -d '' source; do
            relative="${source#review/}"
            target="artifacts/${relative%.md}.pdf"
            mkdir -p "$(dirname "$target")"
            pandoc "$source" \
              --from=markdown+tex_math_dollars+raw_html \
              --pdf-engine=xelatex \
              --variable=geometry:margin=22mm \
              --variable=mainfont:"DejaVu Sans" \
              --variable=fontsize:10pt \
              --variable=colorlinks:true \
              --variable=linkcolor:teal \
              --metadata=lang:nb-NO \
              --output="$target"
            echo "Built $target"
          done < <(find review -type f -name '*.md' -print0)

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: review-pdfs
          path: artifacts/**/*.pdf
          if-no-files-found: error
          retention-days: 30
